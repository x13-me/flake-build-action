name: Nix Build
run-name: "Nix Build${{ (github.event.client_payload.dispatch_id || inputs.dispatch_id) && format(' [{0}]', github.event.client_payload.dispatch_id || inputs.dispatch_id) || format(' [run {0}]', github.run_id) }}"

on:
  repository_dispatch:
    types: [nix-build]

  workflow_dispatch:
    inputs:
      repo:
        description: "Repository (owner/name)"
        required: true
      ref:
        description: "Git ref (branch, tag, or SHA)"
        required: true
        default: main
      update_flake:
        description: "Run `nix flake update` before building"
        required: false
        default: false
        type: boolean
      report_status:
        description: "Post commit statuses back to the source repo (enable for repos the PAT can write to)"
        required: false
        default: false
        type: boolean
      dispatch_id:
        description: "Identifier shown in the run name (optional)"
        required: false
        type: string

jobs:
  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-26.04
    permissions:
      contents: "read"

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
      repo: ${{ steps.resolve.outputs.repo }}
      sha: ${{ steps.source.outputs.sha }}
      report_status: ${{ steps.resolve.outputs.report_status }}

    steps:
      - name: Resolve repo and ref
        id: resolve
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            echo "repo=${{ github.event.client_payload.repo }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}"   >> "$GITHUB_OUTPUT"
            report_status='${{ github.event.client_payload.report_status }}'
            [[ -z "$report_status" || "$report_status" == 'null' ]] && report_status='false'
            echo "report_status=${report_status}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${{ inputs.repo }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}"   >> "$GITHUB_OUTPUT"
            echo "report_status=${{ inputs.report_status }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            substituters = https://${{ secrets.CACHE }}/?priority=100 ${{ vars.SUBSTITUTERS}}
            trusted-public-keys = ${{ secrets.CACHE_KEY }} ${{ vars.PUBKEYS }}
            build-dir = /nix/build
          summarize: false

      - name: Start Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Check out build repo (for scripts)
        uses: actions/checkout@v6
        with:
          path: _build-repo

      - name: Check out private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private-repo

      - name: Resolve source SHA and report matrix pending
        id: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          REPO: ${{ steps.resolve.outputs.repo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_STATUS: ${{ steps.resolve.outputs.report_status }}
        run: |
          set -euo pipefail
          echo "::add-mask::${REPO}"
          sha=$(git -C _private-repo rev-parse HEAD)
          echo "::add-mask::${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [[ "$REPORT_STATUS" != 'true' ]]; then
            echo "Status reporting disabled; skipping."
            exit 0
          fi
          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/statuses/${sha}" \
            -d "$(jq -nc \
              --arg state 'pending' \
              --arg target_url "$RUN_URL" \
              --arg context 'nix-build/generate-matrix' \
              --arg description 'Enumerating flake build targets' \
              '{state:$state, target_url:$target_url, context:$context, description:$description}')"

      - name: Generate matrix
        id: matrix
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          chmod +x _build-repo/scripts/generate-matrix.sh
          matrix=$(_build-repo/scripts/generate-matrix.sh _private-repo)
          echo "$matrix"

          count=$(printf '%s' "$matrix" | jq '.include | length')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

          if [[ "$count" -gt 0 ]]; then
            echo "has_targets=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report matrix result
        if: always() && steps.source.outputs.sha != '' && steps.resolve.outputs.report_status == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          REPO: ${{ steps.resolve.outputs.repo }}
          SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          HAS_TARGETS: ${{ steps.matrix.outputs.has_targets }}
          TARGETS: ${{ steps.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          echo "::add-mask::${REPO}"
          echo "::add-mask::${SHA}"
          post_status() {
            local context="$1" state="$2" description="$3"
            curl --fail-with-body -sS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/statuses/${SHA}" \
              -d "$(jq -nc \
                --arg state "$state" \
                --arg target_url "$RUN_URL" \
                --arg context "$context" \
                --arg description "$description" \
                '{state:$state, target_url:$target_url, context:$context, description:$description}')"
          }

          case "$JOB_STATUS" in
            success)
              if [[ "$HAS_TARGETS" == 'true' ]]; then
                count=$(printf '%s' "$TARGETS" | jq '.include | length')
                post_status 'nix-build/generate-matrix' success "Found ${count} matrix entries"
                post_status 'nix-build/result' pending 'Builds in progress'
              else
                post_status 'nix-build/generate-matrix' success 'No buildable targets found'
                post_status 'nix-build/result' success 'No buildable targets found'
              fi
              ;;
            cancelled)
              post_status 'nix-build/generate-matrix' error 'Matrix generation cancelled'
              post_status 'nix-build/result' error 'Matrix generation cancelled'
              ;;
            *)
              post_status 'nix-build/generate-matrix' failure 'Matrix generation failed'
              post_status 'nix-build/result' failure 'Matrix generation failed'
              ;;
          esac

  build:
    name: "Build: ${{ matrix.name }}"
    needs: generate-matrix
    if: needs.generate-matrix.outputs.has_targets == 'true'

    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: "read"

    steps:
      - name: Resolve repo and ref
        id: resolve
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            echo "repo=${{ github.event.client_payload.repo }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.client_payload.ref }}"   >> "$GITHUB_OUTPUT"
            echo "update_flake=${{ github.event.client_payload.update_flake || false }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${{ inputs.repo }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}"   >> "$GITHUB_OUTPUT"
            echo "update_flake=${{ inputs.update_flake }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: wimpysworld/nothing-but-nix@main

      - name: Create Nix post-build hook
        run: |
          sudo mkdir -p /nix
          sudo tee /nix/post-build-hook.sh > /dev/null <<'EOF'
          #!/bin/bash
          set -uo pipefail
          export PATH="/nix/var/nix/profiles/default/bin:$PATH"
          LOG="/tmp/nix-post-build-hook.log"
          if [[ -n "${OUT_PATHS:-}" ]]; then
            if nix copy --to "${{ secrets.TARGET }}/upload?compression=zstd" ${DRV_PATH:-} ${OUT_PATHS}; then
              echo "OK ${DRV_PATH:-} ${OUT_PATHS}" >> "$LOG"
            else
              echo "FAIL ${DRV_PATH:-} ${OUT_PATHS}" >> "$LOG"
            fi
          fi
          EOF
          sudo chmod +x /nix/post-build-hook.sh
          sudo touch /tmp/nix-post-build-hook.log
          sudo chmod 666 /tmp/nix-post-build-hook.log

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            substituters = https://${{ secrets.CACHE }}/?priority=100 ${{ vars.SUBSTITUTERS}}
            trusted-public-keys = ${{ secrets.CACHE_KEY }} ${{ vars.PUBKEYS }}
            build-dir = /nix/build
            post-build-hook = /nix/post-build-hook.sh

      - name: Start Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Check out build repo (for scripts)
        uses: actions/checkout@v6
        with:
          path: _build-repo

      - name: Check out private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private-repo

      - name: Update flake.lock (optional)
        if: steps.resolve.outputs.update_flake == 'true'
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='ssh://git@github.com/'
          export GIT_CONFIG_KEY_1='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_1="Authorization: Basic $(printf 'x-access-token:%s' "$PRIVATE_REPO_PAT" | base64 -w0)"
          nix flake update --accept-flake-config --flake _private-repo || echo "FAILED TO UPDATE AT LEAST ONE INPUT"
          echo "flake.lock updated (build-only, not committed)"
          git -C _private-repo diff --stat -- flake.lock || true

      - name: Build and push targets
        env:
          SYSTEM: ${{ matrix.system }}
          TARGETS_JSON: ${{ toJson(matrix.targets) }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -uo pipefail

          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0='url.https://github.com/.insteadOf'
          export GIT_CONFIG_VALUE_0='ssh://git@github.com/'
          export GIT_CONFIG_KEY_1='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_1="Authorization: Basic $(printf 'x-access-token:%s' "$PRIVATE_REPO_PAT" | base64 -w0)"

          failed_build=()
          failed_push=()

          build_one() {
            local attr="$1" label="$2"

            echo "::group::nix build: ${label}"
            nix build \
              "_private-repo#${attr}" \
              --keep-going \
              --print-build-logs \
              --accept-flake-config \
              --out-link "result-${label}" \
            || failed_build+=("$label")
            echo "::endgroup::"

            if [[ ! -e "result-${label}" ]]; then
              return
            fi

            echo "::group::nix copy: ${label}"
            nix copy --to "${{ secrets.TARGET }}/upload?compression=zstd" "$(readlink -f "result-${label}")" \
            || failed_push+=("$label")
            echo "::endgroup::"
          }

          while IFS=$'\t' read -r kind name; do
            case "$kind" in
              packages)
                build_one "packages.${SYSTEM}.${name}"  "pkg-${name}"
                ;;
              devShells)
                build_one "devShells.${SYSTEM}.${name}" "shell-${name}"
                ;;
              formatter)
                [[ "$name" == "true" ]] || continue
                build_one "formatter.${SYSTEM}" "fmt"
                ;;
              checks)
                build_one "checks.${SYSTEM}.${name}"    "check-${name}"
                ;;
              nixosConfigurations)
                build_one \
                  "nixosConfigurations.${name}.config.system.build.toplevel" \
                  "cfg-${name}"
                ;;
              *)
                echo "::warning::Unknown target kind '${kind}', skipping '${name}'"
                ;;
            esac
          done < <(printf '%s' "$TARGETS_JSON" | jq -r '
            .[] | to_entries[]
            | .key as $k
            | (if (.value | type) == "array" then .value[] else "true" end)
            | [$k, .] | @tsv
          ')

          ok=true

          if [[ ${#failed_build[@]} -gt 0 ]]; then
            echo "::error::Build failed for: ${failed_build[*]}"
            ok=false
          fi

          if [[ ${#failed_push[@]} -gt 0 ]]; then
            echo "::error::Cache push failed for: ${failed_push[*]}"
            ok=false
          fi

          if [[ -f /tmp/nix-post-build-hook.log ]]; then
            hook_failures=$(grep '^FAIL' /tmp/nix-post-build-hook.log || true)
            if [[ -n "$hook_failures" ]]; then
              echo "::error::Intermediate cache push failures detected:"
              echo "$hook_failures"
              ok=false
            fi
          fi

          echo "::group::nix copy --all"
          nix copy --to "${{ secrets.TARGET }}/upload?compression=zstd" --all || true
          echo "::endgroup::"

          $ok || exit 1

  report:
    name: Report build result
    needs: [generate-matrix, build]
    if: always() && needs.generate-matrix.outputs.has_targets == 'true' && needs.generate-matrix.outputs.report_status == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Report aggregate result
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
          REPO: ${{ needs.generate-matrix.outputs.repo }}
          SHA: ${{ needs.generate-matrix.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.generate-matrix.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "::add-mask::${REPO}"
          echo "::add-mask::${SHA}"
          if [[ -z "${SHA:-}" || -z "${REPO:-}" ]]; then
            echo "Missing source repo/SHA; cannot report status."
            exit 0
          fi

          case "$BUILD_RESULT" in
            success)   state=success; description='All build targets succeeded' ;;
            cancelled) state=error;   description='Build cancelled' ;;
            failure)   state=failure; description='One or more build targets failed' ;;
            skipped)
              echo "Build skipped (matrix result: ${MATRIX_RESULT}); leaving existing status."
              exit 0
              ;;
            *)         state=error;   description="Build ended with result: ${BUILD_RESULT}" ;;
          esac

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/statuses/${SHA}" \
            -d "$(jq -nc \
              --arg state "$state" \
              --arg target_url "$RUN_URL" \
              --arg context 'nix-build/result' \
              --arg description "$description" \
              '{state:$state, target_url:$target_url, context:$context, description:$description}')"
